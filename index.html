<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Wishlist</title>
<meta name="theme-color" content="#fff5f8">
<script>
/* Applies the saved theme (or your device's light/dark setting) before the page paints, so there is no flash. */
(function(){
  var t=null; try{ t=localStorage.getItem('wishlist-theme'); }catch(e){}
  if(!t) t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   STYLES
   - Colors are in :root below. Change them to restyle the whole page.
   - --slide-time controls how long the carousel transition takes (1s).
   ===================================================================== */
:root{
  --rose-50:#ffeaf1; --rose-100:#ffd9e6; --rose-200:#ffc2d6; --rose-500:#e0668f;
  --ink:#5b3a4a; --ink-soft:#9a7384;
  /* ★ LIGHT MODE COLORS (default). Dark mode colors are in the [data-theme="dark"] block below. ★ */
  --bg-1:#fff5f8; --bg-2:#ffe9f1; --bg-3:#f3e8ff;          /* page background gradient */
  --blob-1:#ffc2d6; --blob-2:#e9ddff; --blob-3:#ffe3d3;    /* floating glow blobs */
  --blob-opacity:.55;
  --surface:rgba(255,255,255,.82);                          /* card background */
  --surface-border:rgba(255,255,255,.9);
  --chip:rgba(255,255,255,.85);                             /* small labels and arrow buttons */
  --media-end:#e9ddff;                                      /* picture placeholder gradient end */
  --card-shadow:0 18px 40px -18px rgba(224,102,143,.45),0 2px 6px rgba(224,102,143,.08);
  --radius:28px;
  --slide-time:.5s;                      /* <-- fade length of the cards (was ".0.5s", a typo the browser ignores) */
  --ease:cubic-bezier(.45,.05,.25,1);   /* smooth ease-in-out */
}
/* ★ DARK MODE COLORS — edit these to restyle the dark theme ★ */
[data-theme="dark"]{
  --rose-50:#3a2336; --rose-100:#4a2b45; --rose-200:#6a3a5c; --rose-500:#f58fb2;
  --ink:#fbe6ef; --ink-soft:#c9a3b6;
  --bg-1:#1b1020; --bg-2:#26142c; --bg-3:#1a1630;
  --blob-1:#8a3a66; --blob-2:#4b3a8a; --blob-3:#7a4a4a;
  --blob-opacity:.35;
  --surface:rgba(48,28,52,.78);
  --surface-border:rgba(255,255,255,.09);
  --chip:rgba(60,36,64,.88);
  --media-end:#3a2f63;
  --card-shadow:0 18px 40px -18px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Quicksand',system-ui,sans-serif; color:var(--ink); min-height:100vh; min-height:100dvh;
  background:linear-gradient(160deg,#fff5f8 0%,#ffe9f1 45%,#f3e8ff 100%);
  overflow-x:hidden; position:relative;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* dark background layer that fades in when dark mode is on */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .7s ease;
  background:linear-gradient(160deg,#1b1020 0%,#26142c 45%,#1a1630 100%)}
[data-theme="dark"] body::before{opacity:1}
/* soft floating background blobs */
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:var(--blob-opacity);z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate;transition:background .7s ease,opacity .7s ease}
.b1{width:340px;height:340px;background:var(--blob-1);top:-80px;left:-90px}
.b2{width:300px;height:300px;background:var(--blob-2);bottom:-90px;right:-70px;animation-delay:-6s}
.b3{width:220px;height:220px;background:var(--blob-3);top:45%;left:60%;animation-delay:-11s}
@keyframes drift{to{transform:translate(30px,-24px) scale(1.12)}}

main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:clamp(28px,6vw,64px) 0 48px}
header{text-align:center;padding:0 24px;margin-bottom:clamp(18px,4vw,36px)}
.eyebrow{display:inline-block;font-weight:600;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rose-500);
  background:var(--chip);border:1px solid var(--rose-100);padding:7px 16px;border-radius:99px;backdrop-filter:blur(8px)}
/* smooth colour change when switching light / dark */
h1,.sub,.title,.desc,.hint,footer,.eyebrow,.tag,.price{transition:color .6s ease,background-color .6s ease,border-color .6s ease}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.2rem,7vw,4rem);line-height:1.05;margin:16px 0 10px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--rose-500)}
.sub{color:var(--ink-soft);font-size:clamp(.95rem,2.4vw,1.1rem);max-width:34ch;margin:0 auto;line-height:1.5}

/* ---------- Carousel ---------- */
.stage{position:relative;--cw:min(80vw,380px);--pad:28px}   /* --cw = card width */
/* The track is exactly ONE card wide (plus a little padding so the shadow isn't cut),
   so only the current item is ever visible. Neighbours stay hidden off-screen. */
.track{
  position:relative;display:flex;gap:calc(var(--pad)*2);overflow-x:auto;scroll-snap-type:x mandatory;
  width:calc(var(--cw) + var(--pad)*2);margin:0 auto;
  padding:24px var(--pad) 36px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 var(--cw);min-width:0;scroll-snap-align:center;
  transition:transform var(--slide-time) var(--ease),opacity var(--slide-time) var(--ease),filter var(--slide-time) var(--ease);
  transform:scale(.92);opacity:0;filter:saturate(.8)}
.slide.active{transform:scale(1);opacity:1;filter:none}

.card{
  display:flex;flex-direction:column;height:100%;text-decoration:none;color:inherit;
  background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--surface-border);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--card-shadow);
  transition:box-shadow .5s ease,transform .5s ease,background-color .6s ease,border-color .6s ease,color .6s ease;-webkit-tap-highlight-color:transparent;
}
a.card:hover{box-shadow:0 26px 50px -16px rgba(224,102,143,.55)}
[data-theme="dark"] a.card:hover{box-shadow:0 26px 50px -16px rgba(245,143,178,.35)}
a.card:active{transform:scale(.985)}

/* picture area */
.media{position:relative;aspect-ratio:1/1;overflow:hidden;
  background:linear-gradient(135deg,var(--rose-100),var(--media-end))}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.08);
  transition:opacity var(--slide-time) var(--ease),transform 1.4s var(--ease)}
.media img.loaded{opacity:1;transform:scale(1)}
.slide:not(.active) .media img.loaded{transform:scale(1.05)}
/* shown only when an item has no picture (or the picture fails to load) */
.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.placeholder svg{width:30%;height:30%;opacity:.85;filter:drop-shadow(0 6px 10px rgba(224,102,143,.35))}

.tag{position:absolute;top:14px;left:14px;z-index:2;font-size:.72rem;font-weight:700;letter-spacing:.06em;
  background:var(--chip);color:var(--rose-500);padding:6px 12px;border-radius:99px;backdrop-filter:blur(6px)}
.num{position:absolute;top:14px;right:14px;z-index:2;font-family:'Fraunces',serif;font-style:italic;color:#fff;
  font-size:1rem;text-shadow:0 1px 6px rgba(224,102,143,.6)}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.title{font-family:'Fraunces',serif;font-weight:600;font-size:1.28rem;line-height:1.2}
.desc{color:var(--ink-soft);font-size:.92rem;line-height:1.55;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.price{font-weight:700;font-size:1.25rem;color:var(--rose-500)}
.go{font-weight:700;font-size:.85rem;color:#fff;background:linear-gradient(135deg,#f58fb2,#e0668f);padding:10px 18px;border-radius:99px;
  box-shadow:0 8px 16px -6px rgba(224,102,143,.7);white-space:nowrap;transition:transform .4s ease}
a.card:hover .go{transform:translateX(3px)}
.go.off{background:var(--rose-100);color:var(--ink-soft);box-shadow:none}

/* ---------- Light / Dark switch (top right corner) ----------
   To move it, change top/right below. To resize it, change width/height. */
.theme-switch{
  position:fixed;z-index:50;top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 14px);
  width:68px;height:36px;padding:0;border-radius:99px;cursor:pointer;
  border:1px solid var(--rose-200);background:var(--rose-100);
  box-shadow:0 8px 20px -8px rgba(224,102,143,.55);
  transition:background-color .6s ease,border-color .6s ease;-webkit-tap-highlight-color:transparent;
}
.theme-switch:focus-visible{outline:3px solid var(--rose-500);outline-offset:3px}
.theme-switch .knob{
  position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#fff,#ffeaf1);color:#e0668f;display:grid;place-items:center;
  box-shadow:0 3px 8px rgba(224,102,143,.45);
  transition:transform .6s var(--ease),background .6s ease,color .6s ease;
}
.theme-switch svg{position:absolute;width:16px;height:16px;transition:opacity .4s ease,transform .6s var(--ease)}
.theme-switch .moon{opacity:0;transform:rotate(-60deg) scale(.6)}
[data-theme="dark"] .theme-switch .knob{transform:translateX(32px);background:linear-gradient(135deg,#5a3a7a,#3a2563);color:#ffe3a8}
[data-theme="dark"] .theme-switch .sun{opacity:0;transform:rotate(60deg) scale(.6)}
[data-theme="dark"] .theme-switch .moon{opacity:1;transform:none}

/* arrows + dots */
.nav{position:absolute;top:40%;z-index:5;width:48px;height:48px;border-radius:50%;border:1px solid var(--rose-100);cursor:pointer;
  background:var(--chip);color:var(--rose-500);font-size:1.3rem;display:none;place-items:center;
  box-shadow:0 10px 24px -8px rgba(224,102,143,.5);transition:transform .3s ease,background .6s ease,border-color .6s ease}
.nav:hover{transform:scale(1.08)}
@media(min-width:620px){.nav{display:grid}.prev{left:calc(50% - var(--cw)/2 - 80px)}.next{right:calc(50% - var(--cw)/2 - 80px)}}
.dots{display:flex;justify-content:center;gap:9px;margin-top:2px;padding:0 20px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:99px;border:0;padding:0;background:var(--rose-200);cursor:pointer;
  transition:width var(--slide-time) var(--ease),background var(--slide-time) var(--ease)}
.dot.on{width:28px;background:var(--rose-500)}
.hint{text-align:center;color:var(--ink-soft);font-size:.8rem;margin-top:18px;opacity:.8}
footer{text-align:center;color:var(--ink-soft);font-size:.82rem;margin-top:28px;padding:0 20px}
footer b{color:var(--rose-500)}
.reveal{animation:rise 1s var(--ease) both}
.reveal.d2{animation-delay:.15s}.reveal.d3{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

<body>

<!-- ★ LIGHT / DARK SWITCH (fixed in the top right corner) ★ -->
<button class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Dark mode" title="Light / Dark mode">
  <span class="knob">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8z"/></svg>
  </span>
</button>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<main>
  <header>
    <span class="eyebrow reveal">✿ my little list ✿</span>
    <!-- CHANGE THE PAGE TITLE AND SUBTITLE HERE -->
    <h1 class="reveal d2">Teacher Norly's <em>Wishlist</em></h1>
    <p class="sub reveal d3">Thank you ♡ </p>
  </header>

  <section class="stage reveal d3" aria-roledescription="carousel" aria-label="Wishlist items">
    <button class="nav prev" aria-label="Previous item">‹</button>
    <div class="track" id="track" tabindex="0"></div>   <!-- cards are generated here by the script -->
    <button class="nav next" aria-label="Next item">›</button>
    <div class="dots" id="dots"></div>
  </section>

  <p class="hint">Swipe, use the arrows, or press ← → on your keyboard</p>
  <footer><b>♥</b></footer>
</main>

<script>
/* =====================================================================
   ★★★  YOUR WISHLIST ITEMS GO HERE  ★★★

   HOW TO ADD AN ITEM
   1. Copy one whole block from  { ... }  (including the comma at the end).
   2. Paste it right below the last item, inside the [ ] brackets.
   3. Change the text between the quotes.
   4. Save the file and refresh the page. That's it!

   WHAT EACH FIELD MEANS
   title        The caption / name of the item.
   description  A short note about the item (shows up to 3 lines).
   price        Anything you like, e.g. "₱299" or "₱1,250".
   url          The link opened when the card is clicked (Shopee, Lazada, etc.).
                Leave it as "" if there is no link yet.
   image        The PICTURE of the item. Two ways to set it:
                 a) A file next to this html file, e.g. "images/dress.jpg"
                    (make a folder called "images" beside this file and put your photos in it)
                 b) A web address of a picture, e.g. "https://example.com/photo.jpg"
                Tip: use square-ish photos (like 800 x 800 px) so they fill the card nicely.
                If the picture is missing or fails to load, a soft pink placeholder is shown.
   tag          Small label on the picture, e.g. "Shopee". Use "" to hide it.

   TO REMOVE AN ITEM: delete its whole { ... } block.
   TO REORDER ITEMS : move the blocks up or down.
   ===================================================================== */
const ITEMS = [

  /* ---------- ITEM 1 (your sample Shopee item) ---------- */
  {
    title: "COROLLA Unisex White Rubber School Shoes",
    description: "Soft PU Material Lightweight Korean Shoes         Color: White & Black  |      Size: 39",
    price: "₱ 675",                                    // <- put the real price here
    url: "https://ph.shp.ee/Hextrjg1",
    image: "https://down-ph.img.susercontent.com/file/cn-11134207-7ras8-m61z0dsosdkr41@resize_w450_nl.webp",                    // <- save the product photo as images/twinkler.jpg
    tag: "Shopee"
  },
  
 {
    title: "MIA Low Cut Rubber Sneakers",
    description: "Low Cut Rubber Sneakers Soft Sole Training Shoes              Color: Khaki/Pink | Size: 39",               
    price: "₱ 675",                                    // <- put the real price here
    url: "https://shopee.ph/MIA-Shoes-for-Women-Low-Cut-Rubber-Sneakers-Soft-Sole-Training-Shoes-i.224012602.29879735762?extraParams=%7B%22display_model_id%22%3A300340197431%2C%22model_selection_logic%22%3A3%7D&image_ids=ph-11134207-7ra0u-mdh3xog330q28d&incoming_source=srp&rModelId=300340197431&vItemId=28695014114&vModelId=416039554813&vShopId=1257811163",
    image: "https://down-ph.img.susercontent.com/file/ph-11134207-7ra0s-mde1swj7ybqp86.webp",                    // <- save the product photo as images/twinkler.jpg
    tag: "Shopee"
  },

  
 {
    title: "HODEKT Mini Rice Cooker Cute Bear",
    description: "2.5L 700W Boiling & Steaming Easy To Clean Multi-Cooker",
    price: "₱ 799",
    url: "https://shopee.ph/HODEKT-Mini-Rice-Cooker-Cute-Bear-2.5L-700W-Boiling-Steaming-Easy-To-Clean-Multi-Cooker-i.804104458.45016859907?extraParams=%7B%22display_model_id%22%3A401431255727%2C%22model_selection_logic%22%3A3%7D&image_ids=cn-11134207-820l4-msnlzw60lon9a8",
    image: "https://down-ph.img.susercontent.com/file/cn-11134207-820l4-mse16jnjdki25e@resize_w450_nl.webp",
    tag: "Shopee"
  },
   {
    title: "Samyang Buldak Carbonara Ramen",
    description: "Samyang Buldak Carbonara Ramen 130g | 10 pcs",
    price: "₱ 518",
    url: "https://shopee.ph/HODEKT-Mini-Rice-Cooker-Cute-Bear-2.5L-700W-Boiling-Steaming-Easy-To-Clean-Multi-Cooker-i.804104458.45016859907?extraParams=%7B%22display_model_id%22%3A401431255727%2C%22model_selection_logic%22%3A3%7D&image_ids=cn-11134207-820l4-msnlzw60lon9a8",
    image: "https://down-ph.img.susercontent.com/file/ph-11134207-820l6-msdvrs5qs0le8d.webp",
    tag: "Shopee"
  },
  
  {
    title: "Dungeon Crawler Carl",
    description: "Dungeon Crawler Series, Book 1: Dungeon Crawler Carl by Matt Dinniman",
    price: "₱ 918",
    url: "https://shopee.ph/product/157956840/41128678722?d_id=7e133&fbclid=IwY2xjawV0oI5leHRuA2FlbQIxMQBwZG9mA3NydGMGYXBwX2lkATAAAR8YMK3rw14m465QNL1GUxfiw_iQAWE8quqGlRI30Rk9lWwGx_U5snauLouPWA_aem_lDM96sHJXQeTAPhw9hDBog&uls_trackid=577gev3303sp&utm_content=97X1sA77DX2En8nDth5iCcH7zz3",
    image: "https://down-ph.img.susercontent.com/file/sg-11134201-825zk-mkiwn09wd5aga5.webp",
    tag: "Shopee"
  },

   {
    title: "Carl's Doomsday Scenario",
    description: "Dungeon Crawler Series, Book 2: Dungeon Crawler Carl by Matt Dinniman",
    price: "₱ 1,024",
    url: "https://shopee.ph/Carl's-Doomsday-Scenario-Dungeon-Crawler-Carl-Book-2-(Paperback)-by-Matt-Dinniman-i.157956840.40683645664?extraParams=%7B%22display_model_id%22%3A431380273907%2C%22model_selection_logic%22%3A3%7D&image_ids=sg-11134201-8258j-ms0wb49pq1oic9",
    image: "https://down-ph.img.susercontent.com/file/sg-11134201-8258j-ms0wb49pq1oic9.webp",
    tag: "Shopee"
  },
  /* ---------- ADD NEW ITEMS BELOW ----------
     Put a comma after the item above, then paste your new block here:
  ,{
    title: "",
    description: "",
    price: "",
    url: "",
    image: "images/your-photo.jpg",
    tag: ""
  }
  -------------------------------------------- */
];

/* =====================================================================
   SETTINGS
   ===================================================================== */
const SLIDE_MS   = 1000;   // carousel transition: 1000 ms = 1 second
const AUTOPLAY   = true;   // set to false to stop the automatic sliding
const AUTOPLAY_MS = 5000;  // time each card stays before moving on

/* =====================================================================
   CODE BELOW: you do not need to edit anything past this line
   ===================================================================== */
const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4.3 2.4h.1c.9-1.3 2.3-2.4 4.3-2.4 3.300 0 5.100 3.400 3.600 6.800C19.500 16.400 12 21 12 21z"/></svg>';

ITEMS.forEach((it, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.setAttribute('role', 'group');
  slide.setAttribute('aria-label', `${i + 1} of ${ITEMS.length}`);
  const linked = /^https?:\/\//i.test(it.url || '');
  const el = linked ? 'a' : 'div';
  const attrs = linked ? `href="${esc(it.url)}" target="_blank" rel="noopener noreferrer"` : '';
  slide.innerHTML = `
    <${el} class="card" ${attrs}>
      <div class="media">
        <div class="placeholder">${HEART}</div>
        ${it.image ? `<img alt="${esc(it.title)}" decoding="async" referrerpolicy="no-referrer">` : ''}
        ${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}
        <span class="num">${String(i + 1).padStart(2, '0')}</span>
      </div>
      <div class="body">
        <h2 class="title">${esc(it.title)}</h2>
        <p class="desc">${esc(it.description)}</p>
        <div class="row">
          <span class="price">${esc(it.price)}</span>
          <span class="go ${linked ? '' : 'off'}">${linked ? 'View item ↗' : 'No link yet'}</span>
        </div>
      </div>
    </${el}>`;
  track.appendChild(slide);

  if (it.image) {                                    // fade the picture in once it has loaded
    const img = slide.querySelector('img');
    img.onload  = () => img.classList.add('loaded');
    img.onerror = () => img.remove();                // missing picture -> pink placeholder stays
    img.src = it.image;
  }
  const d = document.createElement('button');
  d.className = 'dot';
  d.setAttribute('aria-label', `Go to item ${i + 1}`);
  d.onclick = () => { stop(); go(i); };
  dotsEl.appendChild(d);
});

const slides = [...track.children], dots = [...dotsEl.children];
let cur = 0, timer = null, anim = null;

function setActive(i) {
  cur = i;
  slides.forEach((s, k) => s.classList.toggle('active', k === i));
  dots.forEach((d, k) => d.classList.toggle('on', k === i));
}

/* Smooth 1-second scroll (browsers don't let CSS set the duration of a scroll,
   so we animate it ourselves). */
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function go(i) {
  i = (i + slides.length) % slides.length;
  const s = slides[i];
  const target = s.offsetLeft - (track.clientWidth - s.clientWidth) / 2;
  const start = track.scrollLeft, dist = target - start;
  setActive(i);
  cancelAnimationFrame(anim);
  if (Math.abs(dist) < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) { track.scrollLeft = target; return; }
  track.style.scrollSnapType = 'none';               // pause snapping while we animate
  const t0 = performance.now();
  const step = now => {
    const p = Math.min((now - t0) / SLIDE_MS, 1);
    track.scrollLeft = start + dist * easeInOut(p);
    if (p < 1) anim = requestAnimationFrame(step);
    else { track.style.scrollSnapType = ''; }        // snapping back on
  };
  anim = requestAnimationFrame(step);
}

document.querySelector('.prev').onclick = () => { stop(); go(cur - 1); };
document.querySelector('.next').onclick = () => { stop(); go(cur + 1); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  if (e.key === 'ArrowLeft')  { stop(); go(cur - 1); }
});

/* while the visitor swipes by hand, show whichever card is in view */
const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting && !anim) setActive(slides.indexOf(en.target)); });
}, { root: track, threshold: 0.6 });
slides.forEach(s => io.observe(s));

function start() { if (AUTOPLAY && slides.length > 1) timer = setInterval(() => go(cur + 1), AUTOPLAY_MS); }
function stop()  { clearInterval(timer); timer = null; }
['pointerdown', 'touchstart', 'wheel'].forEach(ev => track.addEventListener(ev, () => { stop(); cancelAnimationFrame(anim); track.style.scrollSnapType = ''; }, { passive: true }));

/* ---------- Light / Dark switch ----------
   Click the switch to toggle. Your choice is remembered on this device.
   The first time, it follows your phone/computer's own light or dark setting.
   To always START in one mode, edit the first <script> near the top of the file (inside <head>). */
const themeBtn = document.getElementById('themeSwitch');
const themeMeta = document.querySelector('meta[name="theme-color"]');
function applyTheme(t, save) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.setAttribute('aria-checked', String(t === 'dark'));
  themeMeta && themeMeta.setAttribute('content', t === 'dark' ? '#1b1020' : '#fff5f8');
  if (save) { try { localStorage.setItem('wishlist-theme', t); } catch (_) {} }
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light', false);
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
});
if (window.matchMedia) {                                // follow the device setting until you pick one yourself
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    let saved = null; try { saved = localStorage.getItem('wishlist-theme'); } catch (_) {}
    if (!saved) applyTheme(e.matches ? 'dark' : 'light', false);
  });
}

setActive(0);
requestAnimationFrame(() => { track.scrollLeft = slides[0].offsetLeft - (track.clientWidth - slides[0].clientWidth) / 2; start(); });
addEventListener('resize', () => { track.scrollLeft = slides[cur].offsetLeft - (track.clientWidth - slides[cur].clientWidth) / 2; });

</script>
</body>
</html>
